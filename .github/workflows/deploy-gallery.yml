name: Deploy Supabase gallery
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/gallery/**'
      - '.github/workflows/deploy-gallery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-gallery-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy gallery Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN repository secret"; exit 1; }
          supabase functions deploy gallery --project-ref umpxzotllsxbvnextapx --no-verify-jwt
