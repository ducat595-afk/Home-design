name: Deploy Supabase gallery
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/gallery/**'
      - '.github/workflows/deploy-gallery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-gallery-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Diagnose Supabase management API access
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: umpxzotllsxbvnextapx
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN repository secret"; exit 1; }
          echo "Supabase CLI version:"
          supabase --version
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          base = "https://api.supabase.com/v1"
          ref = os.environ["PROJECT_REF"]
          token = os.environ["SUPABASE_ACCESS_TOKEN"]
          checks = [
              ("Projects list", f"{base}/projects"),
              ("Project detail", f"{base}/projects/{ref}"),
              ("Functions list", f"{base}/projects/{ref}/functions"),
          ]
          for label, url in checks:
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/json",
              })
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      status = response.status
                      body = response.read(32768)
              except urllib.error.HTTPError as e:
                  status = e.code
                  body = e.read(32768)
              except Exception as e:
                  print(f"{label}: transport error ({type(e).__name__})")
                  continue
              print(f"{label}: HTTP {status}")
              try:
                  obj = json.loads(body)
                  if isinstance(obj, dict):
                      for key in ("message", "error", "code"):
                          value = obj.get(key)
                          if isinstance(value, str):
                              # Restrict output to known-safe short diagnostics.
                              safe = "".join(c for c in value if c.isalnum() or c in " ._-:/")
                              print(f"  {key}: {safe[:180]}")
                  elif isinstance(obj, list):
                      print(f"  accessible projects: {len(obj)}")
                      print(f"  target project visible: {any(isinstance(p,dict) and p.get('id')==ref for p in obj)}")
              except (ValueError, UnicodeDecodeError):
                  print("  response is not JSON")
          PY
      - name: Deploy gallery Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy gallery --project-ref umpxzotllsxbvnextapx --no-verify-jwt
