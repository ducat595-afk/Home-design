name: Deploy Supabase gallery
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/gallery/**'
      - '.github/workflows/deploy-gallery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-gallery-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Diagnose Supabase management API access
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: umpxzotllsxbvnextapx
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN repository secret"; exit 1; }
          echo "Supabase CLI version:"
          supabase --version
          echo "Checking project endpoint (only HTTP status is printed):"
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF")
          echo "Project endpoint HTTP $status"
          echo "Checking Edge Functions list endpoint (only HTTP status is printed):"
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/functions")
          echo "Functions endpoint HTTP $status"
      - name: Deploy gallery Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy gallery --project-ref umpxzotllsxbvnextapx --no-verify-jwt
