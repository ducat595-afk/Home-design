<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>HOME DESIGN | Photo Gallery</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:#0b121e;color:#f4f2ed;min-height:100vh}
header{padding:22px max(20px,5vw);border-bottom:1px solid #263447;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-size:clamp(17px,3.8vw,25px);letter-spacing:.15em;font-weight:700}
main{max-width:1150px;margin:auto;padding:36px 20px 70px}
h1{font-size:clamp(24px,5vw,36px);margin:0 0 12px}p{line-height:1.8;color:#b7c2d0}
.panel{max-width:520px;margin:10vh auto 0;padding:30px;border:1px solid #344254;border-radius:20px;background:#142133}
form{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
input{flex:1;min-width:150px;background:#202e41;color:white;border:1px solid #66788c;border-radius:10px;padding:14px;font:inherit}
button{font:inherit;border:0;border-radius:10px;padding:12px 19px;background:#d6b988;color:#172333;font-weight:700;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:3px}
button.secondary{background:#27384d;color:white}
.hidden{display:none!important}
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px;margin-top:25px}
.photo{padding:0;background:#1c2a3a;aspect-ratio:1;overflow:hidden;border-radius:12px;display:block;width:100%}
.photo img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .2s}
.photo:active img{transform:scale(1.04)}
#status{margin-top:16px;min-height:24px}
#viewer{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.97);display:flex;align-items:center;justify-content:center;padding:60px 10px 24px}
#viewer img{max-width:100%;max-height:calc(100dvh - 90px);object-fit:contain}
#close{position:absolute;right:16px;top:16px;border-radius:100px}
#counter{position:absolute;left:18px;top:23px;color:#fff;font-size:14px}
.nav{position:absolute;top:50%;transform:translateY(-50%);background:#ffffff33;color:white;padding:14px}
#prev{left:8px}#next{right:8px}
@media(min-width:700px){#grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}}
</style>
</head>
<body>
<header><div class="logo">HOME DESIGN <span style="font-weight:400;font-size:.6em">PHOTO GALLERY</span></div><button id="logout" class="secondary hidden">ログアウト</button></header>
<main>
<section id="login" class="panel">
<h1>共有アルバム</h1><p>パスワードを入力すると写真を表示します。</p>
<form id="loginForm"><input id="password" type="password" placeholder="パスワード" autocomplete="current-password" required><button type="submit">写真を見る</button></form>
<p id="loginError" role="alert" style="color:#f3b4a6"></p>
</section>
<section id="gallery" class="hidden">
<div class="topline"><div><h1>写真一覧</h1><p>写真をタップすると拡大表示できます。</p></div><div style="display:flex;gap:10px;flex-wrap:wrap"><button id="addPhotos" type="button">＋ 写真を追加</button><button id="reload" class="secondary">更新</button></div></div>
<p id="status" role="status"></p><div id="grid"></div>
</section>
</main>
<div id="viewer" class="hidden" role="dialog" aria-modal="true" aria-label="写真を拡大表示">
<span id="counter"></span><button id="close" class="secondary" aria-label="閉じる">× 閉じる</button>
<button id="prev" class="nav" aria-label="前の写真">‹</button><img id="large" alt="拡大写真"><button id="next" class="nav" aria-label="次の写真">›</button>
</div>
<script>
"use strict";
// This is a visual gate only. Photos in a public GitHub repository are PUBLIC.
const PASSWORD_SHA256="e83d594711fee89151ea8f6fdf91f700e95dafbb5665c0c91d9d89fbb3516143";
const REPO="ducat595-afk/Home-design";
const $=id=>document.getElementById(id);
let photos=[],current=0;
async function digest(s){const bytes=new TextEncoder().encode(s);const hash=await crypto.subtle.digest("SHA-256",bytes);return Array.from(new Uint8Array(hash),b=>b.toString(16).padStart(2,"0")).join("")}
function showGallery(){ $("login").classList.add("hidden");$("gallery").classList.remove("hidden");$("logout").classList.remove("hidden");loadPhotos()}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();$("loginError").textContent="";const pass=$("password").value;const valid=(await digest(pass))===PASSWORD_SHA256;$("password").value="";if(!valid){$("loginError").textContent="パスワードが違います。";return}sessionStorage.setItem("homeGalleryAccess","yes");showGallery()});
$("logout").onclick=()=>{sessionStorage.removeItem("homeGalleryAccess");photos=[];$("grid").replaceChildren();closeViewer();$("gallery").classList.add("hidden");$("logout").classList.add("hidden");$("login").classList.remove("hidden")};
async function loadPhotos(){
 $("status").textContent="写真を読み込んでいます…";$("grid").replaceChildren();
 try{
  const res=await fetch("https://api.github.com/repos/"+REPO+"/contents/photos?ref=main",{headers:{Accept:"application/vnd.github+json"},cache:"no-store"});
  if(res.status===404){$("status").textContent="まだ写真がありません。GitHubのphotosフォルダーに画像を追加してください。";return}
  if(!res.ok)throw new Error("写真一覧の取得に失敗しました ("+res.status+")");
  const files=await res.json();
  photos=files.filter(f=>f.type==="file" && /\.(jpe?g|png|webp|gif|avif)$/i.test(f.name)).sort((a,b)=>a.name.localeCompare(b.name,"ja")).map(f=>({url:f.download_url,name:f.name}));
  $("status").textContent=photos.length?photos.length+"枚の写真":"まだ写真がありません。GitHubのphotosフォルダーに画像を追加してください。";
  for(let i=0;i<photos.length;i++){const p=photos[i],btn=document.createElement("button"),img=document.createElement("img");btn.className="photo";btn.type="button";btn.setAttribute("aria-label",p.name+"を拡大");img.src=p.url;img.alt=p.name;img.loading="lazy";btn.append(img);btn.onclick=()=>openViewer(i);$("grid").append(btn)}
 }catch(e){$("status").textContent="写真を読み込めませんでした。少し待ってから「更新」を押してください。"}
}
function openViewer(i){if(!photos.length)return;current=(i+photos.length)%photos.length;$("large").src=photos[current].url;$("large").alt=photos[current].name;$("counter").textContent=(current+1)+" / "+photos.length;$("viewer").classList.remove("hidden");document.body.style.overflow="hidden"}
function closeViewer(){$("viewer").classList.add("hidden");$("large").removeAttribute("src");document.body.style.overflow=""}
$("addPhotos").onclick=()=>{window.open("https://github.com/ducat595-afk/Home-design/upload/main/photos","_blank","noopener,noreferrer")};
$("close").onclick=closeViewer;$("prev").onclick=()=>openViewer(current-1);$("next").onclick=()=>openViewer(current+1);$("reload").onclick=loadPhotos;
$("viewer").onclick=e=>{if(e.target===$("viewer"))closeViewer()};
document.addEventListener("keydown",e=>{if($("viewer").classList.contains("hidden"))return;if(e.key==="Escape")closeViewer();if(e.key==="ArrowLeft")openViewer(current-1);if(e.key==="ArrowRight")openViewer(current+1)});
if(sessionStorage.getItem("homeGalleryAccess")==="yes")showGallery();
</script>
</body></html>
