<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Home Design | Private Gallery</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}body{margin:0;background:#0d1522;color:#f3f6fa}header{padding:25px 5%;border-bottom:1px solid #344052;display:flex;justify-content:space-between;align-items:center}h1{font-size:1.3rem;letter-spacing:.1em}main{max-width:1100px;margin:auto;padding:24px}input,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #63748c}input{background:#1c2a3b;color:white;max-width:100%}button{background:#d3b78c;color:#18202a;cursor:pointer;font-weight:700}button.secondary{background:#27374a;color:white}.hidden{display:none!important}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-top:24px}.tile{border:0;background:#1b2839;padding:0;overflow:hidden;aspect-ratio:1;cursor:pointer}.tile img{width:100%;height:100%;object-fit:cover}#viewer{position:fixed;inset:0;background:#000e;display:grid;place-items:center;padding:12px;z-index:10}#viewer img{max-width:95vw;max-height:85vh;object-fit:contain}#viewer button{position:absolute;right:16px;top:16px}#status{min-height:24px;color:#efc98d}#admin{margin-top:20px}input[type=file]{max-width:90%}
</style></head><body><header><h1>HOME DESIGN <small>PHOTO GALLERY</small></h1><button id="logout" class="secondary hidden">ログアウト</button></header>
<main><section id="login"><h2>共有アルバム</h2><p>共有パスワードを入力してください。</p><form id="loginForm"><input id="password" type="password" autocomplete="current-password" placeholder="共有パスワード" required><button>写真を見る</button></form><p>管理者は管理用パスワードでログインしてください。</p></section>
<section id="gallery" class="hidden"><h2>写真一覧</h2><button id="reload" class="secondary">更新</button><div id="admin" class="hidden"><input id="photos" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" multiple><button id="upload">アップロード</button><p>管理者は写真を選んでアップロードできます。削除は写真を長押しせず、各写真の削除ボタンから行えます。</p></div><div id="grid"></div></section><p id="status" role="status"></p></main>
<div id="viewer" class="hidden"><button id="close">閉じる</button><img id="large" alt="写真"></div><script src="config.js"></script><script>
const $=id=>document.getElementById(id);let token="",admin=false;
const endpoint=window.GALLERY_CONFIG?.functionUrl||"";
function message(s){$("status").textContent=s}
async function api(action,body={},method="POST"){if(!endpoint.startsWith("https://")||endpoint.includes("YOUR_PROJECT_REF"))throw Error("Supabase URLが未設定です");let r;try{r=await fetch(endpoint+"/"+action,{method,headers:{"Content-Type":"application/json",...(token?{"Authorization":"Bearer "+token}:{})},body:JSON.stringify(body)});}catch(e){throw Error("通信に失敗しました（CORSまたはネットワーク）。アクセス元: "+location.origin+" / API: "+new URL(endpoint).origin+" / 詳細: "+(e instanceof Error?e.message:String(e))+"。SupabaseのALLOWED_ORIGINと関数のOPTIONS応答を確認してください。")}const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"通信エラー "+r.status);return d}
$("loginForm").onsubmit=async e=>{e.preventDefault();try{message("認証中…");const d=await api("login",{password:$("password").value});token=d.token;admin=!!d.admin;$("password").value="";$("login").classList.add("hidden");$("gallery").classList.remove("hidden");$("logout").classList.remove("hidden");$("admin").classList.toggle("hidden",!admin);await load()}catch(e){message(e.message)}};
$("logout").onclick=()=>{token="";admin=false;$("gallery").classList.add("hidden");$("login").classList.remove("hidden");$("logout").classList.add("hidden");$("grid").replaceChildren();message("ログアウトしました")};
async function load(){try{message("写真を読み込み中…");const d=await api("list");$("grid").replaceChildren();for(const p of d.photos){const wrap=document.createElement("div");const b=document.createElement("button");b.className="tile";const im=document.createElement("img");im.src=p.url;im.loading="lazy";im.alt="共有写真";b.append(im);b.onclick=()=>{$("large").src=p.url;$("viewer").classList.remove("hidden")};wrap.append(b);if(admin){const del=document.createElement("button");del.textContent="削除";del.className="secondary";del.onclick=async()=>{if(!confirm("この写真を削除しますか？"))return;try{await api("delete",{path:p.path});await load()}catch(e){message(e.message)}};wrap.append(del)}$("grid").append(wrap)}message(d.photos.length+"枚の写真")}catch(e){message(e.message)}}
$("reload").onclick=load;$("close").onclick=()=>{$("viewer").classList.add("hidden");$("large").removeAttribute("src")};
$("upload").onclick=async()=>{const files=Array.from($("photos").files);if(!files.length)return message("写真を選択してください");for(const f of files){try{if(f.size>8*1024*1024)throw Error("8MBを超える写真はアップロードできません");const buf=await f.arrayBuffer();const bytes=new Uint8Array(buf);let binary="";for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.subarray(i,i+8192));await api("upload",{name:f.name,type:f.type,data:btoa(binary)});message(f.name+" を保存しました")}catch(e){message(f.name+": "+e.message);return}}$("photos").value="";await load()};
</script></body></html>
